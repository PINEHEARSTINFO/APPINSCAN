<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord - Monitoring Entrées ASTER</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 15px;
    }
    .config-box {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 15px;
      max-width: 400px;
      margin: 0 auto 20px auto;
      text-align: left;
      font-size: 0.85em;
    }
    .config-box label {
      font-weight: bold;
      color: #555;
      display: block;
      margin-bottom: 5px;
    }
    .config-box input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto 25px auto;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #00b894;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .status-box {
      background-color: #00b894;
      color: white;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }
    .status-box h3 {
      margin: 5px 0;
      font-size: 1.3em;
    }
    .status-box p {
      margin: 3px 0;
    }
    .history-container {
      text-align: left;
      max-width: 400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .history-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.9em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h2>Monitoring Entrées en Direct</h2>

  <!-- Configuration de l'URL Google Apps Script -->
  <div class="config-box">
    <label for="scriptUrl">URL du déploiement Google Apps Script :</label>
    <input type="text" id="scriptUrl" value="https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec" onchange="sauvegarderUrl()">
  </div>
  
  <!-- Fiche du dernier membre scanné -->
  <div class="card" id="latest-scan">
    <p class="empty-msg">En attente du premier scan...</p>
  </div>

  <!-- Historique des récents passages -->
  <h3>Derniers passages</h3>
  <div class="history-container" id="history-list">
    <p class="empty-msg">Aucun historique récent</p>
  </div>

  <script>
    let lastScanKey = null;

    const DEFAULT_URL = "https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec";

    // Charger l'URL enregistrée en cache ou utiliser l'URL par défaut
    const urlInput = document.getElementById("scriptUrl");
    const storedUrl = localStorage.getItem("apps_script_url");
    
    if (storedUrl) {
      urlInput.value = storedUrl;
    } else {
      urlInput.value = DEFAULT_URL;
      localStorage.setItem("apps_script_url", DEFAULT_URL);
    }

    function sauvegarderUrl() {
      const url = urlInput.value.trim();
      localStorage.setItem("apps_script_url", url);
      checkNewScans();
    }

    // Fonction de correction de l'heure (Conversion UTC/GMT -> Europe/Paris)
    function corrigerHeure(heureBrute) {
      if (!heureBrute) return "";
      
      const parts = heureBrute.split(':');
      if (parts.length >= 2) {
        const now = new Date();
        const dateUtc = new Date(Date.UTC(
          now.getFullYear(),
          now.getMonth(),
          now.getDate(),
          parseInt(parts[0], 10),
          parseInt(parts[1], 10),
          parts[2] ? parseInt(parts[2], 10) : 0
        ));
        
        return dateUtc.toLocaleTimeString('fr-FR', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZone: 'Europe/Paris'
        });
      }
      return heureBrute;
    }

    async function checkNewScans() {
      const webAppUrl = urlInput.value.trim() || DEFAULT_URL;

      try {
        const response = await fetch(`${webAppUrl}?action=getLastScan`);
        const data = await response.json();

        if (data.success && data.scan) {
          const currentScanKey = data.scan.id + "_" + data.scan.heure;
          
          if (currentScanKey !== lastScanKey) {
            lastScanKey = currentScanKey;
            updateDashboard(data.scan, data.history);
          }
        }
      } catch (error) {
        console.error("Erreur de communication avec le script Google Apps Script :", error);
      }
    }

    function updateDashboard(latest, history) {
      const heureCorrige = corrigerHeure(latest.heure);

      // Mise à jour du bloc principal
      const latestContainer = document.getElementById("latest-scan");
      const photoSrc = (latest.photoUrl && latest.photoUrl.length > 5) ? latest.photoUrl : "https://via.placeholder.com/110";
      
      latestContainer.innerHTML = `
        <img class="avatar" src="${photoSrc}" alt="Photo de ${latest.nom}">
        <div class="status-box">
          <p style="font-weight:bold;">✓ ENTRÉE VALIDÉE (${heureCorrige})</p>
          <h3>${latest.nom}</h3>
          <p>ID : ${latest.id}</p>
        </div>
      `;

      // Mise à jour de la liste d'historique
      const historyContainer = document.getElementById("history-list");
      if (history && history.length > 0) {
        historyContainer.innerHTML = history.map(item => `
          <div class="history-item">
            <span><strong>${item.nom}</strong> <small style="color:#666;">(${item.id})</small></span>
            <span style="color:#00b894; font-weight:bold;">${corrigerHeure(item.heure)}</span>
          </div>
        `).join('');
      }
    }

    // Interrogation automatique du serveur toutes les 2,5 secondes
    setInterval(checkNewScans, 2500);
    checkNewScans();
  </script>
</body>
</html>
