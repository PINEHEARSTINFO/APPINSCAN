<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord - Contrôle d'Entrée ASTER</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; text-align: center; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 20px auto; }
    .avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00b894; object-fit: cover; }
    .status-box { background-color: #00b894; color: white; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .status-box h3 { margin: 5px 0; font-size: 1.3em; text-transform: capitalize; }
    .history-list { text-align: left; max-width: 400px; margin: 0 auto; background: white; border-radius: 8px; padding: 10px; }
    .history-item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 0.9em; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <h2>Monitoring Entrées en Direct</h2>
  
  <!-- Fiche du dernier membre scanné -->
  <div class="card" id="latest-scan">
    <p style="color: #888;">En attente du premier scan...</p>
  </div>

  <!-- Historique des derniers passages -->
  <h3>Derniers passages</h3>
  <div class="history-list" id="history-container">
    <p style="color: #aaa; text-align: center;">Aucun historique récent</p>
  </div>

  <script>
    // Remplacez par l'URL de votre Web App Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYK6QJ3yP7hmgfbrlT4c-dqZmD-qxwCMdN5TE3UvNMB8dWmTRky-SkTqWumYXH5_h_kQ/exec"; 
    let lastRecordedId = null;

    async function checkNewScans() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getLastScan`);
        const data = await response.json();

        if (data.success && data.scan) {
          // Vérifier s'il s'agit d'un nouveau scan
          if (data.scan.timestamp !== lastRecordedId) {
            lastRecordedId = data.scan.timestamp;
            updateDashboard(data.scan, data.history);
          }
        }
      } catch (error) {
        console.error("Erreur de synchronisation:", error);
      }
    }

    function updateDashboard(latest, history) {
      // Mettre à jour le dernier membre scanné
      const latestContainer = document.getElementById("latest-scan");
      latestContainer.innerHTML = `
        <img class="avatar" src="${latest.photoUrl || 'https://via.placeholder.com/110'}" alt="Photo">
        <div class="status-box">
          <p style="margin:0; font-weight:bold;">✓ ENTRÉE VALIDÉE (${latest.heure})</p>
          <h3>${latest.nom}</h3>
          <p style="margin:0;">ID : ${latest.id}</p>
        </div>
      `;

      // Mettre à jour l'historique rapide
      const historyContainer = document.getElementById("history-container");
      if (history && history.length > 0) {
        historyContainer.innerHTML = history.map(item => `
          <div class="history-item">
            <span><strong>${item.nom}</strong> (${item.id})</span>
            <span style="color:#666;">${item.heure}</span>
          </div>
        `).join('');
      }
    }

    // Interroger le serveur toutes les 2.5 secondes
    setInterval(checkNewScans, 2500);
    checkNewScans();
  </script>
</body>
</html>
