<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- 1. Balise Viewport stricte pour Smartphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  
  <!-- 2. Configurations App Mobile (iOS / Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f6f9">

  <title>Tableau de Bord - Monitoring Entrées ASTER</title>
  
  <style>
    * {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      text-align: center;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .logo-container {
      margin: 5px auto 10px auto;
      max-width: 150px;
      width: 100%;
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      color: #333;
      margin: 5px 0 12px 0;
      font-size: 1.25em;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto 15px auto;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #00b894;
      object-fit: cover;
      margin-bottom: 8px;
    }

    .status-box {
      background-color: #00b894;
      color: white;
      border-radius: 8px;
      padding: 12px 8px;
      margin-top: 5px;
    }

    .status-box h3 {
      margin: 4px 0;
      font-size: 1.2em;
      word-break: break-word;
    }

    .status-box p {
      margin: 2px 0;
      font-size: 0.85em;
    }

    .history-container {
      text-align: left;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .history-item {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .mini-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ddd;
      background-color: #eee;
      flex-shrink: 0;
    }

    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 8px 0;
    }

    #scriptUrl {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo ASTER" id="app-logo">
  </div>

  <h2>Monitoring Entrées</h2>

  <!-- URL Masquée -->
  <input type="hidden" id="scriptUrl" value="https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec">

  <!-- Fiche du dernier membre scanné -->
  <div class="card" id="latest-scan">
    <p class="empty-msg">En attente du premier scan...</p>
  </div>

  <!-- Historique -->
  <h3 style="font-size: 1em; color: #444; margin-bottom: 8px; text-align: left;">Derniers passages</h3>
  <div class="history-container" id="history-list">
    <p class="empty-msg">Aucun historique récent</p>
  </div>

  <script>
    let lastScanKey = null;
    const DEFAULT_URL = "https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec";
    const urlInput = document.getElementById("scriptUrl");

    function nettoyerHeure(heureBrute) {
      if (!heureBrute) return "--:--:--";
      const strHeure = String(heureBrute).trim();
      if (strHeure.indexOf("T") !== -1) {
        const parts = strHeure.split("T")[1];
        return parts ? parts.substring(0, 8) : strHeure;
      }
      return strHeure.substring(0, 8);
    }

    async function checkNewScans() {
      const webAppUrl = urlInput.value.trim() || DEFAULT_URL;
      try {
        const response = await fetch(`${webAppUrl}?action=getLastScan`);
        const data = await response.json();

        if (data.success && data.scan) {
          const currentScanKey = String(data.scan.id) + "_" + String(data.scan.heure);
          if (currentScanKey !== lastScanKey) {
            lastScanKey = currentScanKey;
            updateDashboard(data.scan, data.history);
          }
        }
      } catch (error) {
        console.error("Erreur de connexion :", error);
      }
    }

    function updateDashboard(latest, history) {
      const heureAffichee = nettoyerHeure(latest.heure);
      const latestContainer = document.getElementById("latest-scan");

      const hasPhoto = latest.photoUrl && String(latest.photoUrl).trim().length > 5;
      const htmlPhoto = hasPhoto ? `<img class="avatar" src="${latest.photoUrl}" alt="Photo">` : '';

      latestContainer.innerHTML = `
        ${htmlPhoto}
        <div class="status-box">
          <p style="font-weight:bold;">✓ ENTRÉE VALIDÉE (${heureAffichee})</p>
          <h3>${latest.nom || 'Inconnu'}</h3>
          <p>ID : ${latest.id || 'N/A'}</p>
        </div>
      `;

      const historyContainer = document.getElementById("history-list");
      if (history && history.length > 0) {
        historyContainer.innerHTML = history.map(item => {
          const thumbSrc = (item.photoUrl && String(item.photoUrl).trim().length > 5) 
            ? item.photoUrl 
            : 'https://via.placeholder.com/32?text=?';

          return `
            <div class="history-item">
              <div class="history-user-info">
                <img class="mini-thumb" src="${thumbSrc}" alt="Avatar">
                <span><strong>${item.nom || 'Inconnu'}</strong></span>
              </div>
              <span style="color:#00b894; font-weight:bold; margin-left: 5px;">${nettoyerHeure(item.heure)}</span>
            </div>
          `;
        }).join('');
      } else {
        historyContainer.innerHTML = '<p class="empty-msg">Aucun historique récent</p>';
      }
    }

    setInterval(checkNewScans, 2500);
    checkNewScans();
  </script>
</body>
</html>
