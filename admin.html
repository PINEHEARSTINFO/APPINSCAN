<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Adaptation stricte pour l'affichage mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tableau de Bord - Monitoring Entrées ASTER</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 12px;
      text-align: center;
      width: 100%;
    }
    .logo-container {
      margin: 10px auto 15px auto;
      max-width: 180px;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    h2 {
      color: #333;
      margin: 10px 0 15px 0;
      font-size: 1.4em;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      margin: 0 auto 20px auto;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #00b894;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .status-box {
      background-color: #00b894;
      color: white;
      border-radius: 8px;
      padding: 15px 10px;
      margin-top: 10px;
    }
    .status-box h3 {
      margin: 5px 0;
      font-size: 1.3em;
      word-break: break-word;
    }
    .status-box p {
      margin: 3px 0;
      font-size: 0.9em;
    }
    .history-container {
      text-align: left;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .history-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .empty-msg {
      color: #aaa;
      text-align: center;
      margin: 10px 0;
    }
    
    /* Masquer discrètement l'input URL */
    #scriptUrl {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Logo de l'événement -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo ASTER" id="app-logo">
  </div>

  <h2>Monitoring Entrées en Direct</h2>

  <!-- URL conservée en arrière-plan -->
  <input type="hidden" id="scriptUrl" value="https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec">

  <!-- Fiche du dernier membre scanné -->
  <div class="card" id="latest-scan">
    <p class="empty-msg">En attente du premier scan...</p>
  </div>

  <!-- Historique des récents passages -->
  <h3 style="font-size: 1.1em; color: #444; margin-bottom: 10px;">Derniers passages</h3>
  <div class="history-container" id="history-list">
    <p class="empty-msg">Aucun historique récent</p>
  </div>

  <script>
    let lastScanKey = null;
    const DEFAULT_URL = "https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec";
    const urlInput = document.getElementById("scriptUrl");

    // Traitement propre de l'affichage de l'heure
    function nettoyerHeure(heureBrute) {
      if (!heureBrute) return "--:--:--";
      const strHeure = String(heureBrute).trim();
      
      if (strHeure.indexOf("T") !== -1) {
        const parts = strHeure.split("T")[1];
        return parts ? parts.substring(0, 8) : strHeure;
      }
      return strHeure.substring(0, 8);
    }

    async function checkNewScans() {
      const webAppUrl = urlInput.value.trim() || DEFAULT_URL;

      try {
        const response = await fetch(`${webAppUrl}?action=getLastScan`);
        const data = await response.json();

        if (data.success && data.scan) {
          const currentScanKey = String(data.scan.id) + "_" + String(data.scan.heure);
          
          if (currentScanKey !== lastScanKey) {
            lastScanKey = currentScanKey;
            updateDashboard(data.scan, data.history);
          }
        }
      } catch (error) {
        console.error("Erreur de connexion au serveur :", error);
      }
    }

    function updateDashboard(latest, history) {
      const heureAffichee = nettoyerHeure(latest.heure);

      const latestContainer = document.getElementById("latest-scan");
      const photoSrc = (latest.photoUrl && String(latest.photoUrl).length > 5) ? latest.photoUrl : "https://via.placeholder.com/110";
      
      latestContainer.innerHTML = `
        <img class="avatar" src="${photoSrc}" alt="Photo de ${latest.nom || 'Membre'}">
        <div class="status-box">
          <p style="font-weight:bold;">✓ ENTRÉE VALIDÉE (${heureAffichee})</p>
          <h3>${latest.nom || 'Nom indisponible'}</h3>
          <p>ID : ${latest.id || 'N/A'}</p>
        </div>
      `;

      const historyContainer = document.getElementById("history-list");
      if (history && history.length > 0) {
        historyContainer.innerHTML = history.map(item => `
          <div class="history-item">
            <span><strong>${item.nom || 'Inconnu'}</strong> <small style="color:#666;">(${item.id || ''})</small></span>
            <span style="color:#00b894; font-weight:bold;">${nettoyerHeure(item.heure)}</span>
          </div>
        `).join('');
      } else {
        historyContainer.innerHTML = '<p class="empty-msg">Aucun historique récent</p>';
      }
    }

    setInterval(checkNewScans, 2500);
    checkNewScans();
  </script>
</body>
</html>
