<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Inscrits</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    
    .card-list {
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      text-align: center;
    }

    /* Style du conteneur du logo */
    .logo-container {
      margin: 0 auto 15px auto;
      max-width: 150px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
      margin-bottom: 15px;
    }

    .badge-count {
      background-color: #00b894;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
    }

    .search-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95em;
      margin-bottom: 15px;
      outline: none;
      text-align: left;
    }

    .search-input:focus {
      border-color: #00b894;
    }

    .members-container {
      max-height: 350px;
      overflow-y: auto;
      text-align: left;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .member-item:last-child { border-bottom: none; }

    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #eee;
    }

    .member-name { font-weight: bold; font-size: 0.95em; color: #333; }
    .member-id { font-size: 0.8em; color: #777; }
    
    .loading-text { color: #888; text-align: center; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="card-list">
    <!-- Integration du Logo au-dessus du titre -->
    <div class="logo-container">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="header-title">
      Liste des Inscrits <span class="badge-count" id="totalCount">0</span>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un membre par nom ou ID..." oninput="filtrerMembres()">

    <div class="members-container" id="membersList">
      <div class="loading-text">Chargement des membres...</div>
    </div>
  </div>

</body>
</html>
