<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Inscrits</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    
    .card-list {
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
      margin-bottom: 15px;
    }

    .badge-count {
      background-color: #00b894;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
    }

    .search-input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95em;
      margin-bottom: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #00b894;
    }

    .members-container {
      max-height: 350px;
      overflow-y: auto;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .member-item:last-child { border-bottom: none; }

    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #eee;
    }

    .member-name { font-weight: bold; font-size: 0.95em; color: #333; }
    .member-id { font-size: 0.8em; color: #777; }
    
    .loading-text { color: #888; text-align: center; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="card-list">
    <div class="header-title">
      Liste des Inscrits <span class="badge-count" id="totalCount">0</span>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un membre par nom ou ID..." oninput="filtrerMembres()">

    <div class="members-container" id="membersList">
      <div class="loading-text">Chargement des membres...</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2F-4Q3_mJ8yzDjTT7AZOs-XfrCozkR2YO58Zx2hFj2Zlmt4ugd8QdJ5xcFfMl2QY04w/exec";
    let tousLesMembres = [];

    async function chargerMembres() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getMembers`);
        const data = await response.json();

        if (data.success && data.members) {
          tousLesMembres = data.members;
          document.getElementById("totalCount").innerText = data.total;
          afficherMembres(tousLesMembres);
        } else {
          document.getElementById("membersList").innerHTML = '<div class="loading-text">Aucun membre trouvé.</div>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById("membersList").innerHTML = '<div class="loading-text">Erreur de chargement.</div>';
      }
    }

    function afficherMembres(liste) {
      const container = document.getElementById("membersList");
      if (liste.length === 0) {
        container.innerHTML = '<div class="loading-text">Aucun résultat.</div>';
        return;
      }

      container.innerHTML = liste.map(m => {
        const photo = (m.photoUrl && m.photoUrl.length > 5) ? m.photoUrl : 'https://via.placeholder.com/40?text=?';
        return `
          <div class="member-item">
            <div class="member-info">
              <img class="member-avatar" src="${photo}" alt="Avatar">
              <div>
                <div class="member-name">${m.nom}</div>
                <div class="member-id">${m.id}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrerMembres() {
      const recherche = document.getElementById("searchInput").value.toLowerCase();
      const resultats = tousLesMembres.filter(m => 
        m.nom.toLowerCase().includes(recherche) || m.id.toLowerCase().includes(recherche)
      );
      afficherMembres(resultats);
    }

    // Lancement au chargement de la page
    chargerMembres();
  </script>
</body>
</html>
